<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeFlow Profile</title>

  <link rel="stylesheet" href="css/profile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="container">

    <header>
      <div class="user-info">
        <img id="avatar" src="https://via.placeholder.com/80" alt="avatar">

        <div>
          <h1 id="username">Guest User</h1>
          <p id="email">Not logged in</p>
        </div>
      </div>

      <button onclick="goHome()">🏠 Home</button>
    </header>

    <section class="stats-grid">

      <div class="card">
        <p>Best WPM</p>
        <h2 id="bestWpm">0</h2>
      </div>

      <div class="card">
        <p>Average WPM</p>
        <h2 id="avgWpm">0</h2>
      </div>

      <div class="card">
        <p>Total Tests</p>
        <h2 id="totalTests">0</h2>
      </div>

      <div class="card">
        <p>Best Accuracy</p>
        <h2 id="bestAcc">0%</h2>
      </div>

      <div class="card">
        <p>Current Streak</p>
        <h2 id="streak">0 🔥</h2>
      </div>

    </section>

    <section class="badges">
      <h2>🏅 Achievements</h2>

      <div id="badgeContainer" class="badge-grid"></div>
    </section>

    <section class="history">

      <h2>📊 Recent Tests</h2>

      <div id="historyList"></div>

    </section>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/profile.js"></script>

</body>
</html>
