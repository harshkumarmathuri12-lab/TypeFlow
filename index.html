<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <header>

    <div class="logo">
      <span class="icon">⌨</span>
      <span>TypeFlow</span>
    </div>

    <nav>
      <span>⌨</span>
      <span>👑</span>
      <span>ℹ</span>
      <span>⚙</span>
    </nav>

  </header>

  <!-- MODE BAR -->
  <section class="mode-row">

    <div class="group">
      <button>@ punctuation</button>
      <button># numbers</button>
    </div>

    <div class="group">
      <button id="timeMode" class="active">time</button>
      <button id="wordMode">words</button>
      <button id="quoteMode">quote</button>
    </div>

    <div class="group" id="timeButtons">

      <button class="time" data-time="15">15</button>

      <button class="time" data-time="30">30</button>

      <button class="time active" data-time="60">60</button>

      <button class="time" data-time="120">120</button>

    </div>

    <div class="group hidden" id="wordButtons">

      <button class="word active" data-count="25">25</button>

      <button class="word" data-count="50">50</button>

      <button class="word" data-count="100">100</button>

    </div>

  </section>

  <!-- ==========================
       FOCUS SCREEN
  =========================== -->

  <div id="typingScreen">

    <!-- STATS -->
    <section class="stats">

      <div>
        <p>time</p>
        <h2 id="timer">60</h2>
      </div>

      <div>
        <p>wpm</p>
        <h2 id="wpm">0</h2>
      </div>

      <div>
        <p>cpm</p>
        <h2 id="cpm">0</h2>
      </div>

      <div>
        <p>accuracy</p>
        <h2 id="accuracy">100%</h2>
      </div>

      <div>
        <p>raw</p>
        <h2 id="raw">0</h2>
      </div>

    </section>

    <!-- LANGUAGE -->
    <div class="language">
      english
    </div>

    <!-- TYPING AREA -->
    <section class="typing-area">

      <div class="text-wrapper">

        <div id="caret"></div>

        <div id="textDisplay"></div>

      </div>

      <input
        id="typingInput"
        type="text"
        autocomplete="off"
        spellcheck="false"
        autofocus
      >

    </section>

    <!-- RESTART -->
    <div class="restart" id="restartBtn">
      ↻
    </div>

  </div>

  <!-- ==========================
       BOTTOM SECTION
  =========================== -->

  <section class="bottom">

    <div class="graph-card">

      <div class="title">
        Live WPM Graph
      </div>

      <canvas
        id="liveGraph"
        width="900"
        height="220"
      ></canvas>

    </div>

    <div class="char-card">

      <div class="title">
        Characters
      </div>

      <div class="char-row">

        <span id="liveCorrect" class="green">0</span>

        <span>/</span>

        <span id="liveWrong" class="red">0</span>

        <span>/</span>

        <span id="liveExtra" class="yellow">0</span>

        <span>/</span>

        <span id="liveMissed">0</span>

      </div>

      <div class="labels">

        <span>correct</span>

        <span>wrong</span>

        <span>extra</span>

        <span>missed</span>

      </div>

    </div>

  </section>

</div>

<!-- DATA -->
<script src="js/words.js"></script>
<script src="js/quotes.js"></script>

<!-- MAIN -->
<script src="js/script.js"></script>

</body>
</html>
